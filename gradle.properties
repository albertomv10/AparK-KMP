#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
# Este daemon es también el compilador de Kotlin/Native, que por defecto corre dentro de él. Así que
# este es el techo del enlazado de RELEASE para iOS, que con su LTO (DevirtualizationAnalysis) es lo
# que más memoria pide de todo el build: unos 3 GB vivos, más ráfagas de arrays temporales enormes.
# Medido el 2026-11-24, compilando y enlazando en el mismo daemon y con la JVM limitada a 3 CPU como
# el runner de macOS del CI: con 4 GB el heap se llenaba hasta 4093 MB y solo sobrevivía con
# compactaciones de emergencia (en el CI murió con OutOfMemoryError el 2026-10-18 y el 2026-11-24);
# con 5 GB aún necesitaba una; con 6 GB, ninguna, y el pico fue de 5,6 GB.
#
# `kotlin.native.jvmArgs` NO sirve para esto: con el compilador dentro del daemon, el plugin solo
# mira si lleva `-ea`. Solo se aplica con `kotlin.native.disableCompilerDaemon=true`, que lo sacaría
# a una segunda JVM, y en un runner de 7 GB eso es peor, no mejor.
org.gradle.jvmargs=-Xmx6144M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true