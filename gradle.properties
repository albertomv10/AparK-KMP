#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
# El enlazado de RELEASE para iOS corre LTO (DevirtualizationAnalysis), que es con diferencia lo
# que más memoria pide de todo el build, y sin esta propiedad va con el techo por defecto. Se
# quedaba tan al borde que el mismo commit pasaba en una rama y moría con OutOfMemoryError en otra.
# No se toca `org.gradle.jvmargs`: ese daemon es quien ejecuta R8 en los releases de Android.
kotlin.native.jvmArgs=-Xmx4608M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true