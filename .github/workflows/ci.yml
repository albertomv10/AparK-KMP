name: CI

on:
  pull_request:
  push:
    branches: [main]

# Una serie por rama: un push nuevo cancela la validación anterior en vez de encolarla.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Los ficheros de configuración de Firebase están gitignorados, así que CI los reconstruye desde
  # secretos. Son los del proyecto de DESARROLLO: aquí solo se compila debug.
  GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
  GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
  MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # v4 y no v3: la v3 instala el paquete `tools` del SDK, que Google ha retirado de sus
      # repositorios, así que sdkmanager falla y el job se cae antes de compilar nada.
      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Restaurar configuración local
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Falta el secreto GOOGLE_SERVICES_JSON. Ver docs/FIREBASE.md."
            exit 1
          fi
          # El plugin busca primero en la variante y luego en la raíz del módulo; se escriben las
          # dos para que cualquier variante encuentre configuración.
          mkdir -p composeApp/src/debug
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > composeApp/src/debug/google-services.json
          cp composeApp/src/debug/google-services.json composeApp/google-services.json
          echo "MAPS_API_KEY=${MAPS_API_KEY:-PLACEHOLDER_NOT_A_REAL_KEY}" >> local.properties

      - name: Compilar debug
        run: ./gradlew :composeApp:assembleDebug --no-daemon

      - name: Tests
        run: ./gradlew :composeApp:testDebugUnitTest --no-daemon

  # ¿Toca el cambio algo que pueda romper la app de iOS? El job de iOS tarda entre 7 y 18 minutos
  # incluso en paralelo, y un PR que solo cambia docs/, functions/ o tools/ no tiene por qué
  # esperarlos. Esto tarda segundos y decide.
  changes:
    name: ¿Toca la app?
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          # El commit y su padre bastan. En un PR, checkout trae el commit de merge que prepara
          # GitHub (refs/pull/N/merge), cuyo primer padre es la punta de la rama base: HEAD^1..HEAD
          # es justo lo que el PR añadiría. En main, con squash, cada push es un solo commit.
          fetch-depth: 2

      - id: filter
        name: Mirar qué ficheros cambian
        # Se salta iOS solo si TODO lo que cambia está en esta lista de cosas que no lo afectan.
        # Al revés —una lista de lo que sí lo afecta— un fichero nuevo que nadie previó dejaría
        # iOS sin validar en silencio. Así, lo imprevisto compila: mejor de más que de menos.
        run: |
          if ! CHANGED=$(git diff --name-only HEAD^1 HEAD); then
            echo "No se pudo calcular el diff: se compila iOS por si acaso."
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Ficheros cambiados:"
          echo "$CHANGED"
          IRRELEVANT='^docs/|\.md$|^functions/|^tools/|^firestore\.rules$|^firestore\.indexes\.json$|^firebase\.json$|^\.firebaserc$|^\.mcp\.json$|^opencode\.json$'
          if echo "$CHANGED" | grep -vqE "$IRRELEVANT"; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nada de esto afecta a la app: iOS se salta."
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  ios:
    # macOS es gratis en repositorios públicos, así que no hay razón para no validar iOS en cada PR.
    # Compilar Kotlin para iOS NO compila el Swift: los puentes y las fases de build solo fallan
    # aquí, y de eso ya nos hemos comido un caso.
    name: iOS (${{ matrix.configuration }})
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    strategy:
      # Que un fallo en una no cancele la otra: interesa saber si fallan las dos.
      fail-fast: false
      matrix:
        # Las DOS configuraciones, no solo Debug. Swift compila únicamente la rama viva de un
        # `#if DEBUG`, así que compilar solo Debug deja el código de release sin tocar por nadie:
        # así se coló una referencia a un tipo inexistente que solo fallaba en Release. Y el enlace
        # de Kotlin en Release, con LTO, es el que se quedaba sin memoria.
        #
        # En paralelo, en dos máquinas, y no una detrás de otra: casi todo el tiempo es enlazar el
        # framework de Kotlin, y Debug y Release no comparten ese trabajo, así que juntarlas en una
        # máquina no ahorraba nada y sumaba los dos tiempos.
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restaurar configuración local
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ] || [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "::error::Faltan GOOGLE_SERVICES_JSON o GOOGLE_SERVICE_INFO_PLIST. Ver docs/FIREBASE.md."
            exit 1
          fi
          mkdir -p composeApp/src/debug iosApp/FirebaseConfig/debug iosApp/FirebaseConfig/release
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > composeApp/src/debug/google-services.json
          cp composeApp/src/debug/google-services.json composeApp/google-services.json
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > iosApp/FirebaseConfig/debug/GoogleService-Info.plist
          # La configuración de DESARROLLO también en la ruta de release: aquí solo se comprueba que
          # compila, nunca se produce nada distribuible, así que no hay motivo para meter la config
          # de producción en los secretos. La fase "Setup Firebase" exige que el fichero exista.
          cp iosApp/FirebaseConfig/debug/GoogleService-Info.plist iosApp/FirebaseConfig/release/GoogleService-Info.plist
          echo "MAPS_API_KEY=${MAPS_API_KEY:-PLACEHOLDER_NOT_A_REAL_KEY}" >> local.properties
          echo "GOOGLE_MAPS_API_KEY=${MAPS_API_KEY:-PLACEHOLDER_NOT_A_REAL_KEY}" > iosApp/iosApp/Secrets.xcconfig

      # Los paquetes de Swift (Firebase, Maps, Google Sign-In) se clonan en ~/spm-packages y no
      # dentro de DerivedData, para poder guardarlos entre ejecuciones. Son ~1,3 GB, casi todo
      # frameworks ya compilados que, si no, se bajan de Google y de GitHub cada vez. La ruta tiene
      # que ser la misma aquí y en el `-clonedSourcePackagesDirPath` de xcodebuild.
      #
      # La clave es el lockfile de SPM: mientras no cambie ninguna versión, se reutiliza lo bajado.
      - name: Recuperar los paquetes de Swift
        uses: actions/cache@v4
        with:
          path: ~/spm-packages
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('iosApp/iosApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # Compilar los tests comunes para iOS, sin ejecutarlos: Kotlin/Native rechaza nombres entre
      # acentos graves que la JVM acepta —una coma basta—, así que un test válido en el job de
      # Android puede no compilar aquí. Pasó, y no lo vio nadie.
      #
      # Compilar y no enlazar es deliberado: enlazar el binario de test exige los frameworks de
      # Firebase, que los resuelve SPM desde Xcode y Gradle no tiene. Por eso `allTests` no pasa
      # en este proyecto, y por eso esto se queda en `compileTest...`. Basta con una de las dos
      # máquinas: los tests no tienen configuración Debug o Release.
      - name: Compilar los tests comunes para iOS
        if: matrix.configuration == 'Debug'
        run: ./gradlew :composeApp:compileTestKotlinIosSimulatorArm64 --no-daemon

      - name: Compilar la app de iOS (${{ matrix.configuration }})
        # Sin firma: no hace falta certificado ni equipo para comprobar que compila.
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -configuration "${{ matrix.configuration }}" \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath "$HOME/spm-packages" \
            build CODE_SIGNING_ALLOWED=NO

  functions:
    name: Cloud Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci --prefix functions
      - run: npm run build --prefix functions

  rules:
    name: Reglas y migracion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/package-lock.json

      # El emulador de Firestore corre sobre la JVM, y firebase-tools exige JDK 21 o superior.
      # No es el 17 que usa el job de Android: aquí no se compila nada de Kotlin.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci --prefix tools

      # Arranca el emulador, pasa los tests contra el y lo apaga. No toca ningun proyecto real
      # ni necesita secretos: es el unico job que valida las REGLAS, y no solo que todo compile.
      - run: npm run test:rules --prefix tools
